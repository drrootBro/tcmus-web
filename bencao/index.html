<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ink:#1a1612;--ink-soft:#4a453f;--ink-muted:#8a857d;
  --paper:#faf8f4;--paper-warm:#f0ebe0;--paper-card:#fffdf9;
  --brush:#8b3a2a;--brush-light:rgba(139,58,42,0.08);
  --gold:#b8942a;--gold-light:rgba(184,148,42,0.10);
  --teal:#2a6b5e;--teal-light:rgba(42,107,94,0.08);
  --border:rgba(26,22,18,0.10);--border-warm:rgba(139,58,42,0.15);
}
body{font-family:'Georgia',serif;background:var(--paper);color:var(--ink);overflow-x:hidden;min-height:100vh}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 40% at 10% 20%,rgba(139,58,42,0.03) 0%,transparent 60%),radial-gradient(ellipse 40% 60% at 90% 80%,rgba(42,107,94,0.03) 0%,transparent 60%);pointer-events:none;z-index:0}
.page-rule{position:fixed;left:48px;top:0;bottom:0;width:1px;background:linear-gradient(to bottom,transparent,var(--border-warm) 20%,var(--border-warm) 80%,transparent);z-index:0}
.wrap{position:relative;z-index:1;max-width:960px;margin:0 auto;padding:64px 40px 80px 80px;animation:fadeUp .5s ease both}

.topbar{display:flex;align-items:center;gap:16px;margin-bottom:56px}
.back{font-family:monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted);text-decoration:none;display:flex;align-items:center;gap:8px;transition:color .2s}
.back::before{content:'';display:inline-block;width:16px;height:1px;background:var(--ink-muted);transition:all .2s}
.back:hover{color:var(--teal)}.back:hover::before{background:var(--teal);width:24px}
.topbar-rule{flex:1;height:1px;background:var(--border)}
.topbar-brand{font-family:monospace;font-size:11px;letter-spacing:.2em;color:var(--teal)}

.hero{margin-bottom:40px}
.hero-label{font-family:monospace;font-size:10px;letter-spacing:.3em;text-transform:uppercase;color:var(--brush);display:flex;align-items:center;gap:10px;margin-bottom:12px}
.hero-label::before{content:'';display:inline-block;width:20px;height:1px;background:var(--brush)}
.hero-title{font-size:40px;font-weight:400;line-height:1.1;letter-spacing:-.01em;color:var(--ink);margin-bottom:10px}
.hero-sub{font-size:14px;color:var(--ink-muted);letter-spacing:.08em}

.progress-section{margin-bottom:36px}
.progress-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.progress-label{font-family:monospace;font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-muted)}
.progress-count{font-family:monospace;font-size:10px;color:var(--teal)}
.progress-track{height:2px;background:var(--border);border-radius:1px;overflow:hidden}
.progress-fill{height:100%;background:var(--teal);border-radius:1px;width:100%}

.search-wrap{margin-bottom:28px;position:relative}
.search-input{width:100%;font-family:'Georgia',serif;font-size:14px;color:var(--ink);background:var(--paper-card);border:1px solid var(--border);padding:12px 16px 12px 44px;border-radius:2px;outline:none;transition:border-color .18s}
.search-input:focus{border-color:var(--brush)}
.search-input::placeholder{color:var(--ink-muted)}
.search-icon{position:absolute;left:16px;top:50%;transform:translateY(-50%);width:14px;height:14px;opacity:.4;pointer-events:none}

.cats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:28px}
.cat{font-family:monospace;font-size:10px;letter-spacing:.15em;text-transform:uppercase;padding:5px 12px;border:1px solid var(--border);border-radius:1px;cursor:pointer;background:transparent;color:var(--ink-muted);transition:all .15s}
.cat:hover{border-color:var(--brush);color:var(--brush);background:var(--brush-light)}
.cat.active{border-color:var(--teal);color:var(--teal);background:var(--teal-light)}

.herb-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:2px;background:var(--border);border:1px solid var(--border)}
.herb-card{background:var(--paper-card);padding:22px 18px;text-decoration:none;color:inherit;display:flex;flex-direction:column;gap:5px;transition:background .2s;position:relative;overflow:hidden}
.herb-card::after{content:'';position:absolute;bottom:0;left:18px;right:18px;height:2px;background:var(--teal);transform:scaleX(0);transform-origin:left;transition:transform .28s}
.herb-card:hover{background:var(--paper-warm)}
.herb-card:hover::after{transform:scaleX(1)}
.herb-card.hidden{display:none}

.herb-num{font-family:monospace;font-size:9px;letter-spacing:.15em;color:var(--border);margin-bottom:2px}
.herb-pinyin{font-family:monospace;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--teal)}
.herb-cn{font-size:22px;font-weight:400;line-height:1.1;color:var(--ink)}
.herb-en{font-size:11px;color:var(--ink-muted);letter-spacing:.05em}
.herb-tags{margin-top:5px;display:flex;flex-wrap:wrap;gap:4px}
.herb-tag{font-family:monospace;font-size:9px;letter-spacing:.08em;padding:2px 6px;border:1px solid var(--border);border-radius:1px;color:var(--ink-muted)}

.no-results{grid-column:1/-1;padding:48px;text-align:center;font-family:monospace;font-size:12px;letter-spacing:.15em;color:var(--ink-muted);display:none}
.no-results.show{display:block}

footer{margin-top:48px;display:flex;align-items:center;justify-content:space-between;padding-top:28px;border-top:1px solid var(--border)}
.footer-text{font-family:monospace;font-size:10px;letter-spacing:.15em;color:var(--ink-muted)}
.footer-glyph{font-size:26px;color:var(--border-warm)}

@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:700px){
  .page-rule{display:none}.wrap{padding:40px 20px}
  .herb-grid{grid-template-columns:repeat(2,1fr)}
  .hero-title{font-size:28px}
}
@media(max-width:400px){.herb-grid{grid-template-columns:1fr}}
.tcmus-nav{position:relative;z-index:2;max-width:900px;margin:0 auto;padding:14px 40px 0 80px;font-family:monospace;font-size:10px;letter-spacing:.14em;color:var(--ink-muted);display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.tcmus-nav a{color:var(--ink-soft);text-decoration:none}
.tcmus-nav a:hover{color:var(--brush)}
.tn-sep{color:var(--border-warm)}
@media(max-width:680px){.tcmus-nav{padding:12px 20px 0}}
</style>

<script>
const searchInput = document.getElementById('searchInput');
const cards = document.querySelectorAll('.herb-card');
const noResults = document.getElementById('noResults');
const catBtns = document.querySelectorAll('.cat');
let activeCat = 'all', searchVal = '';

function filterCards() {
  let visible = 0;
  cards.forEach(card => {
    const tags = card.getAttribute('data-tags').toLowerCase();
    const cat  = card.getAttribute('data-cat') || '';
    const matchSearch = !searchVal || tags.includes(searchVal);
    const matchCat = activeCat === 'all' || cat === activeCat;
    if (matchSearch && matchCat) { card.classList.remove('hidden'); visible++; }
    else card.classList.add('hidden');
  });
  noResults.className = visible === 0 ? 'no-results show' : 'no-results';
}

searchInput.addEventListener('input', () => {
  searchVal = searchInput.value.trim().toLowerCase();
  filterCards();
});

catBtns.forEach(btn => {
  btn.addEventListener('click', () => {
    catBtns.forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    activeCat = btn.dataset.cat;
    filterCards();
  });
});
</script>
